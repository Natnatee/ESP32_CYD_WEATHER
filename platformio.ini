[platformio]
default_envs = cyd_ili9341

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_flags =
    -fstack-usage
    -Wframe-larger-than=2048
extra_scripts = post:tools/check_stack_frames.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
    lvgl/lvgl@8.3.11
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -D USER_SETUP_LOADED=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I src
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D USE_HSPI_PORT=1

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1

[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -D ILI9341_DRIVER=1
